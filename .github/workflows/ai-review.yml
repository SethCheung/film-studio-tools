name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: self-hosted
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Python
        run: python3 --version && pip3 install requests

      - name: Run AI Review
        env:
          M3_ULTRA_URL: ${{ secrets.M3_ULTRA_URL }}
          M3_ULTRA_MODEL: ${{ secrets.M3_ULTRA_MODEL }}
          M3_ULTRA_API_KEY: ${{ secrets.M3_ULTRA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/workflows/review_pr.py
